worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # ─── Upstream services ──────────────────────────────────────────────────
  upstream backend {
    server backend:4000;
  }

  upstream frontend {
    server frontend:5173;
  }

  server {
    listen 80;
    server_name _;

    # ─── WebSocket upgrade — Twilio Media Streams ────────────────────────
    # CRITICAL: Twilio connects to /ws/* endpoints via WebSocket.
    # nginx must forward these with the Upgrade header, not as HTTP.
    location /ws/ {
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;   # Keep WS connections open for long calls
      proxy_send_timeout 3600s;
    }

    # ─── REST API ────────────────────────────────────────────────────────
    location /api/ {
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── Frontend (SPA) ──────────────────────────────────────────────────
    location / {
      proxy_pass         http://frontend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      try_files          $uri $uri/ /index.html;
    }
  }
}
